{# A field's error line, p#<name>-error with the alert-circle icon and the words (brief 005, criterion 7; shared by every app since brief 010, criterion 29). Renders nothing when the field has no errors. with: field (BoundField). #}{% if field.errors %}<p class="field__error" id="{{ field.html_name }}-error"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-alert-circle"></use></svg><span>{{ field.errors|join:" " }}</span></p>{% endif %}
