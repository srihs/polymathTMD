{# One class's date and times, e.g. "Mon 5 Oct 2026, 8:30 am to 11:30 am" (Colombo time; formats from the zoom_format filters). with: start, end (aware datetimes). #}{% load zoom_format %}<time datetime="{{ start|date:'c' }}">{{ start|class_date }}</time>, {{ start|class_time }} to {{ end|class_time }}
